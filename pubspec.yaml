name: tripjio
description: A new Flutter project for TripJio.
publish_to: 'none'

version: 1.0.0+1
# Format: <version-name>+<version-code>
# Increment version-code for every Play Store upload (1, 2, 3, ...)

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.0.0
  dio: ^5.3.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  shared_preferences: ^2.3.2
  logger: ^2.4.0
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1 # Standard for controllers/state management
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.0
  google_fonts: ^6.2.0
  supabase_flutter: ^2.8.4
  uuid: ^4.4.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/tripjio_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/tripjio_launcher.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/legal/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

flutter_native_splash:
  color: "#003F7D"
  fullscreen: true

